<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Etiket İşlem Arşivi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --bg: #ffffff; --card: #ffffff; --text: #000000; --border: #000000; --gray: #f0f0f0; --dark-gray: #333333; --error: #d93025; }
        
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); padding: 30px 15px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        
        .header-container { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 800px; border-bottom: 2px solid var(--border); padding-bottom: 8px; margin-bottom: 15px; }
        .header-title h1 { margin: 0; font-size: 18px; text-transform: uppercase; }
        .header-title p { margin: 3px 0 0 0; font-size: 11px; color: var(--dark-gray); }
        
        .btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 0; cursor: pointer; font-weight: bold; font-size: 12px; background: var(--bg); color: var(--text); text-transform: uppercase; text-decoration: none; transition: 0.2s; display: inline-block; }
        .btn:hover { background: var(--text); color: var(--bg); }

        .controls { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 800px; margin-bottom: 15px; background: var(--bg); padding: 10px; border: 1px solid var(--border); box-sizing: border-box; gap: 10px; }
        .search-box { flex: 1; max-width: 350px; }
        .search-box input { width: 100%; padding: 6px 10px; border: 1px solid var(--border); outline: none; font-size: 13px; box-sizing: border-box; }

        .btn-group { display: flex; gap: 8px; }
        .btn-danger { color: var(--error); border-color: var(--error); }
        .btn-danger:hover { background: var(--error); color: var(--bg); }

        .history-table { width: 100%; max-width: 800px; border-collapse: collapse; font-size: 12px; }
        .history-table th, .history-table td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: middle; }
        .history-table th { background-color: var(--gray); text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        
        .text-cell { font-family: monospace; white-space: pre-wrap; max-height: 50px; overflow-y: auto; font-size: 11px; line-height: 1.3; }
        
        .btn-action { padding: 3px 6px; font-size: 10px; font-weight: bold; border: 1px solid var(--border); background: var(--bg); cursor: pointer; text-transform: uppercase; transition: 0.2s; margin: 1px; }
        .btn-action:hover { background: var(--text); color: var(--bg); }
        .btn-delete { color: var(--error); border-color: var(--error); }
        .btn-delete:hover { background: var(--error); color: var(--bg); }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="header-title">
            <h1>Veritabanı İşlem Arşivi</h1>
            <p>SQLite veritabanında kayıtlı tüm geçmiş etiket okumaları</p>
        </div>
        <a href="index.html" class="btn">⬅ Ana Sayfaya Dön</a>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Geçmiş kayıtlar içinde ara..." onkeyup="filterHistory()">
        </div>
        <div class="btn-group">
            <button class="btn" onclick="exportHistoryExcel()"> Excel'e Aktar</button>
            <button class="btn btn-danger" onclick="deleteAllHistory()"> Tümünü Sil</button>
        </div>
    </div>

    <table class="history-table">
        <thead>
            <tr>
                <th style="width: 40px;">ID</th>
                <th style="width: 150px;">Dosya Adı</th>
                <th>Okunan Metin</th>
                <th style="width: 120px;">Tarih</th>
                <th style="width: 140px; text-align: center;">İşlemler</th>
            </tr>
        </thead>
        <tbody id="historyTableBody">
            <tr>
                <td colspan="5" style="text-align: center;">Geçmiş veriler yükleniyor...</td>
            </tr>
        </tbody>
    </table>

    <script>
        let historyData = [];

        window.addEventListener('DOMContentLoaded', fetchHistory);

        async function fetchHistory() {
            try {
                const response = await fetch('http://localhost:5165/api/Label/all');
                if(!response.ok) throw new Error("Veri çekilemedi");
                
                historyData = await response.json();
                renderTable(historyData);
            } catch (error) {
                document.getElementById('historyTableBody').innerHTML = `
                    <tr><td colspan="5" style="text-align:center; color:red;">Veritabanına bağlanılamadı veya geçmiş veri bulunamadı.</td></tr>
                `;
            }
        }

        function renderTable(dataArray) {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';

            if(dataArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Kayıtlı geçmiş veri yok.</td></tr>';
                return;
            }

            dataArray.forEach(item => {
                const id = item.id || item.Id;
                const fileNameDisplay = item.imageUrl || item.ImageUrl || item.fileName || item.FileName || "Bilinmeyen Dosya";
                const text = item.extractedText || item.ExtractedText || "";

                const row = `
                    <tr id="row-${id}">
                        <td><b>#${id}</b></td>
                        <td style="word-break: break-all;">${fileNameDisplay}</td>
                        <td>
                            <div class="text-cell" id="text-${id}">${text}</div>
                        </td>
                        <td style="font-size: 11px;" id="date-${id}">${item.createdAt ? new Date(item.createdAt).toLocaleString('tr-TR') : '-'}</td>
                        <td style="text-align: center; whitespace: nowrap;">
                            <button class="btn-action" onclick="copyText('${escapeHtml(text)}')">Kopyala</button>
                            <button class="btn-action" id="btn-reprocess-${id}" onclick="reprocessInPlace(${id})">Tekrar İşle</button>
                            <button class="btn-action btn-delete" onclick="deleteHistoryItem(${id})">Sil</button>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        function escapeHtml(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // Tekil Kayıt Silme
        async function deleteHistoryItem(id) {
            if(!confirm(`#${id} numaralı kaydı silmek istediğinize emin misiniz?`)) return;

            try {
                const response = await fetch(`http://localhost:5165/api/Label/${id}`, {
                    method: 'DELETE'
                });

                if(response.ok) {
                    historyData = historyData.filter(item => (item.id || item.Id) !== id);
                    renderTable(historyData);
                } else {
                    alert(`Silme başarısız oldu. (HTTP Kodu: ${response.status})`);
                }
            } catch (error) {
                alert("Sunucuya bağlanılamadı.");
            }
        }

        // YENİ: Tüm Arşivi Silme İşlemi
        async function deleteAllHistory() {
            if (historyData.length === 0) {
                alert("Silinecek geçmiş kayıt bulunmuyor.");
                return;
            }

            const confirm1 = confirm("DİKKAT! Tüm veritabanı arşivini ve yüklenen dosyaları silmek üzeresiniz. Emin misiniz?");
            if (!confirm1) return;

            const confirm2 = confirm("Bu işlem GERİ ALINAMAZ! Devam etmek istiyor musunuz?");
            if (!confirm2) return;

            try {
                const response = await fetch('http://localhost:5165/api/Label/deleteAll', {
                    method: 'DELETE'
                });

                if (response.ok) {
                    historyData = [];
                    renderTable(historyData);
                    alert("Tüm geçmiş arşiv başarıyla silindi.");
                } else {
                    alert("Toplu silme sırasında bir hata oluştu.");
                }
            } catch (error) {
                alert("Sunucuya ulaşılamadı.");
            }
        }

        // Yerinde Yeniden İşleme
        async function reprocessInPlace(id) {
            const btn = document.getElementById(`btn-reprocess-${id}`);
            const textDiv = document.getElementById(`text-${id}`);
            const dateTd = document.getElementById(`date-${id}`);

            btn.disabled = true;
            const originalText = btn.innerText;
            btn.innerText = "İşleniyor...";

            try {
                const response = await fetch(`http://localhost:5165/api/Label/reprocess/${id}`, {
                    method: 'PUT'
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    textDiv.innerText = data.extractedText;
                    dateTd.innerText = new Date().toLocaleString('tr-TR');

                    const item = historyData.find(x => (x.id || x.Id) === id);
                    if (item) {
                        if (item.extractedText) item.extractedText = data.extractedText;
                        if (item.ExtractedText) item.ExtractedText = data.extractedText;
                    }

                    alert(`#${id} numaralı etiket başarıyla güncellendi!`);
                } else {
                    const err = await response.json().catch(() => ({}));
                    alert(`İşlem başarısız: ${err.message || 'Sunucu hatası'}`);
                }
            } catch (error) {
                alert("Sunucuya ulaşılamadı.");
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }

        function filterHistory() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = historyData.filter(item => {
                const name = (item.imageUrl || item.ImageUrl || item.fileName || item.FileName || "").toLowerCase();
                const txt = (item.extractedText || item.ExtractedText || "").toLowerCase();
                return name.includes(query) || txt.includes(query);
            });
            renderTable(filtered);
        }

        function copyText(textToCopy) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("Metin panoya kopyalandı!");
            });
        }

        function exportHistoryExcel() {
            if(historyData.length === 0) return alert("Dışa aktarılacak veri yok!");
            
            const excelReady = historyData.map(item => ({
                "ID": item.id || item.Id,
                "Dosya Adı": item.imageUrl || item.ImageUrl || item.fileName || item.FileName,
                "Okunan Metin": item.extractedText || item.ExtractedText,
                "Kayıt Tarihi": item.createdAt ? new Date(item.createdAt).toLocaleString('tr-TR') : '-'
            }));

            const ws = XLSX.utils.json_to_sheet(excelReady);
            const wb = XLSX.utils.book_new();
            ws['!cols'] = [{wch: 10}, {wch: 30}, {wch: 80}, {wch: 20}];

            XLSX.utils.book_append_sheet(wb, ws, "Tüm Arşiv");
            XLSX.writeFile(wb, "Etiket_Veritabani_Arsivi.xlsx");
        }
    </script>
</body>
</html>
